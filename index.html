function getRedirectUri(){return "https://manuel13091978.github.io/portal-honorarios/";}
function getMesCarpeta(){
  const now=new Date(),year=now.getFullYear(),month=String(now.getMonth()+1).padStart(2,"0");
  const mes=now.toLocaleString("es-CL",{month:"long"});
  return `${year}-${month}_${mes.charAt(0).toUpperCase()+mes.slice(1)}`;
}

function rutSinDigito(rut){
  return String(rut).replace(/\./g,"").split("-")[0].replace(/[^0-9]/g,"").trim();
}

function col(row,...keys){
  for(const k of keys){
    if(row[k]!==undefined&&row[k]!==null&&row[k]!=="")return row[k];
    const found=Object.keys(row).find(rk=>rk.trim().toLowerCase()===k.toLowerCase());
    if(found&&row[found]!==undefined&&row[found]!==null&&row[found]!=="")return row[found];
  }
  return "";
}

function parseFechaTope(str){
  if(!str)return null;
  try{
    const clean=String(str).trim().replace(/-/g,"/");
    const parts=clean.split(" ");
    const dp=parts[0].split("/");
    const tp=parts[1]?parts[1].split(":"):[23,59];
    return new Date(dp[2],dp[1]-1,dp[0],tp[0],tp[1]);
  }catch{return null;}
}

function formatFechaTope(str){
  const d=parseFechaTope(str);
  if(!d)return str;
  const dias=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
  const meses=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  const hh=String(d.getHours()).padStart(2,"0");
  const mm=String(d.getMinutes()).padStart(2,"0");
  return `${dias[d.getDay()]} ${d.getDate()} de ${meses[d.getMonth()]} ${d.getFullYear()} a las ${hh}:${mm} hrs`;
}

function isVencido(str){
  const d=parseFechaTope(str);
  return d?new Date()>d:false;
}

function isProxima(str){
  const d=parseFechaTope(str);
  if(!d)return false;
  const diff=(d-new Date())/(1000*60*60);
  return diff>0&&diff<=24;
}

function parseExcelRows(rows){
  return rows.map(r=>{
    const rut       =String(col(r,"Rut","RUT","rut")||"");
    const nombre    =String(col(r,"NOMBRE ENCUESTADOR","NOMBRE","Nombre","nombre")||"");

    const periodo   =String(col(r,"PERIODO PAGO","PERIODO","Período de Pago","periodo")||"");
    const montoUnit =Number(String(col(r,"MONTO UNITARIO","Monto Unitario","monto_unitario")||"0").replace(/[^0-9.-]/g,""))||0;
    const monto     =Number(String(col(r,"MONTO BOLETA","MONTO","Monto","monto","Valor total bruto")||"0").replace(/[^0-9.-]/g,""))||montoUnit||0;
    const encuestas =Number(col(r,"CANTIDAD ENCUESTAS","Cantidad","CANTIDAD","encuestas")||0);
    const empresa   =String(col(r,"Empresa","EMPRESA","empresa")||"");
    const empresaRUT=String(col(r,"RUT EMPRESA","Rut Empresa","rut_empresa")||"");
    const empresaDir=String(col(r,"Dirección Empresa","direccion_empresa","DIRECCION")||"");
    const contrato  =String(col(r,"Contrato Firmado","contrato_firmado","CONTRATO")||"NO").toUpperCase()==="SI";

    const numCuenta =cuentaRUT?rutSinDigito(rut):String(col(r,"Cuenta","CUENTA","numero_cuenta")||"");
    const banco     =cuentaRUT?"ESTADO":String(col(r,"Banco","BANCO","banco")||"");
    const fechaTope =String(col(r,"Fecha Tope","FECHA TOPE","fecha_tope","FechaTope")||"");
    return{rut,nombre,proyecto,periodo,monto,encuestas,empresa,empresaRUT,empresaDir,contrato,cuentaRUT,tipoCuenta,numCuenta,banco,fechaTope,boleta:false,numBoleta:"",boletaUrl:""};

async function getToken(){
  return new Promise((resolve,reject)=>{
    const url="https://accounts.google.com/o/oauth2/v2/auth"
      +"?client_id="+GOOGLE_CLIENT_ID
      +"&response_type=token"
      +"&redirect_uri="+encodeURIComponent(getRedirectUri())
      +"&scope="+encodeURIComponent("https://www.googleapis.com/auth/drive.file")
      +"&prompt=consent";
    const popup=window.open(url,"gauth","width=520,height=660,left=200,top=80");
    if(!popup){reject(new Error("El navegador bloqueó la ventana emergente."));return;}
    const timer=setInterval(()=>{
      try{
        if(!popup||popup.closed){clearInterval(timer);reject(new Error("Ventana cerrada."));return;}
        const hash=popup.location.hash;
        if(hash.includes("access_token")){clearInterval(timer);popup.close();resolve(new URLSearchParams(hash.slice(1)).get("access_token"));}
        if(hash.includes("error=")){clearInterval(timer);popup.close();reject(new Error("Error de autenticación"));}
      }catch(_){}
    },600);
    setTimeout(()=>{clearInterval(timer);try{popup.close();}catch(_){}reject(new Error("Tiempo agotado."));},180000);
  });
}

async function getOrCreateFolder(token, name, parentId=null){
  const h={Authorization:`Bearer ${token}`,"Content-Type":"application/json"};
  const q=parentId
    ?`name='${name}' and mimeType='application/vnd.google-apps.folder' and '${parentId}' in parents and trashed=false`
    :`name='${name}' and mimeType='application/vnd.google-apps.folder' and 'root' in parents and trashed=false`;
  const search=await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name)`,{headers:h});
  const data=await search.json();
  if(data.files&&data.files.length>0) return data.files[0].id;
  const meta={name,mimeType:"application/vnd.google-apps.folder"};
  if(parentId) meta.parents=[parentId];
  const create=await fetch("https://www.googleapis.com/drive/v3/files",{method:"POST",headers:h,body:JSON.stringify(meta)});
  const folder=await create.json();
  return folder.id;
}

async function ensureFolders(token,mesCarpeta){
  const rootId=await getOrCreateFolder(token,FOLDER_ROOT);
  const mesId=await getOrCreateFolder(token,mesCarpeta,rootId);
  return mesId;
}

async function verificarBoleta(fileData, montoEsperado, numBoletaIngresado, apiKey){
  try{
    // Convert PDF to base64
    const bytes = new Uint8Array(fileData);
    let binary = '';
    for(let i=0;i<bytes.byteLength;i++) binary += String.fromCharCode(bytes[i]);
    const base64 = btoa(binary);

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-haiku-4-5-20251001",
        max_tokens: 1000,
        messages: [{
          role: "user",
          content: [
            {
              type: "document",
              source: { type: "base64", media_type: "application/pdf", data: base64 }
            },
            {
              type: "text",
              text: `Analiza esta boleta de honorarios y extrae la siguiente información. Responde SOLO con un JSON válido sin texto adicional ni backticks:
{
  "numeroBoleta": "número de la boleta encontrado en el documento",
  "monto": número total de la boleta en pesos chilenos (solo el número, sin puntos ni signos),
  "emisor": "nombre del emisor de la boleta",
  "receptor": "nombre del receptor/empresa"
}
Si no puedes encontrar algún dato, usa null para ese campo.`
            }
          ]
        }]
      })
    });

    if(!response.ok) throw new Error("Error en API de verificación");
    const data = await response.json();
    const text = data.content[0].text;
    const clean = text.replace(/```json|```/g,"").trim();
    const resultado = JSON.parse(clean);

    const errores = [];
    if(resultado.numeroBoleta && String(resultado.numeroBoleta).trim() !== String(numBoletaIngresado).trim()){
      errores.push(`Número de boleta: PDF dice "${resultado.numeroBoleta}", ingresaste "${numBoletaIngresado}"`);
    }
    if(resultado.monto !== null && resultado.monto !== undefined){
      const montoPDF = Number(String(resultado.monto).replace(/[^0-9]/g,""));
      const diff = Math.abs(montoPDF - montoEsperado);
      if(diff > 100){
        errores.push(`Monto: PDF dice $${montoPDF.toLocaleString("es-CL")}, se esperaba $${montoEsperado.toLocaleString("es-CL")}`);
      }
    }
    return { ok: errores.length === 0, errores, resultado };
  } catch(e) {
    console.warn("Verificación no disponible:", e.message);
    return { ok: true, errores: [], resultado: null, omitida: true };
  }
}

async function uploadPDF(token,fileData,fileName,mesCarpeta){
  const mesId=await ensureFolders(token,mesCarpeta);
  const h={Authorization:`Bearer ${token}`};
  const meta=JSON.stringify({name:fileName,parents:[mesId]});
  const form=new FormData();
  form.append("metadata",new Blob([meta],{type:"application/json"}));
  form.append("file",new Blob([fileData instanceof ArrayBuffer ? new Uint8Array(fileData) : [fileData]],{type:"application/pdf"}));
  const res=await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",{method:"POST",headers:h,body:form});
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e?.error?.message||`Error ${res.status}`);}
  return await res.json();
}

// ── STORAGE HELPERS ──────────────────────────────────────────────────────────
function saveToStorage(key, value){ try{ localStorage.setItem(key, JSON.stringify(value)); }catch(_){} }
function loadFromStorage(key, def){ try{ const v=localStorage.getItem(key); return v?JSON.parse(v):def; }catch(_){ return def; } }

function App(){
  const [view,setView]=useState("home");
  const [adminAuth,setAdmin]=useState(false);
  const [encActivo,setEnc]=useState(null);
  const [odToken,setToken]=useState(()=>{
    try{
      const t=localStorage.getItem("gdrive_token");
      const exp=Number(localStorage.getItem("gdrive_token_expiry")||0);
      if(t && Date.now()<exp) return t;
      localStorage.removeItem("gdrive_token");
      localStorage.removeItem("gdrive_token_expiry");
    }catch(_){}
    return null;
  });

  // Active planilla (visible to encuestadores)
  const [data,setDataState]=useState(()=>loadFromStorage("planilla_activa",[]));
  // Planilla history: [{id, fecha, periodo, rows, activa}]
  const [historial,setHistorialState]=useState(()=>loadFromStorage("planilla_historial",[]));

  const setData = (rows) => {
    setDataState(rows);
    saveToStorage("planilla_activa", rows);
  };

  const setHistorial = (h) => {
    setHistorialState(h);
    saveToStorage("planilla_historial", h);
  };

  const activarPlanilla = (id) => {
    const h = historial.map(p => ({...p, activa: p.id===id}));
    const planilla = h.find(p=>p.id===id);
    setHistorial(h);
    if(planilla){ setData(planilla.rows); }
  };

  const agregarHistorial = (rows, periodo) => {
    const nueva = {
      id: Date.now(),
      fecha: new Date().toLocaleDateString("es-CL"),
      periodo: periodo || getMesCarpeta().replace("_"," "),
      rows,
      activa: true
    };
    const h = [nueva, ...historial.map(p=>({...p,activa:false}))].slice(0,6);
    setHistorial(h);
    setData(rows);
  };

  const setTokenAndSave = (t) => {
    setToken(t);
    if(t){
      const expiry = Date.now() + 55*60*1000;
      try{ localStorage.setItem("gdrive_token",t); localStorage.setItem("gdrive_token_expiry",expiry); }catch(_){}
    }
  };

  if(view==="home")return <Home onAdmin={()=>setView("admin")} onEnc={()=>setView("encuestador")} />;
  if(view==="admin"){
    if(!adminAuth)return <AdminLogin onOk={()=>setAdmin(true)} onBack={()=>setView("home")} />;
    return <AdminPanel data={data} setData={setData} token={odToken} setToken={setTokenAndSave} historial={historial} activarPlanilla={activarPlanilla} agregarHistorial={agregarHistorial} onLogout={()=>{setAdmin(false);setView("home");}} />;
  }
  if(view==="encuestador"){
    if(!encActivo)return <EncLogin data={data} onOk={e=>setEnc(e)} onBack={()=>setView("home")} />;
    const filas=data.filter(r=>r.rut===encActivo[0].rut);
    return <EncView filas={filas} data={data} setData={setData} token={odToken} setToken={setTokenAndSave} onBack={()=>setEnc(null)} />;
  }
}

function EncView({filas,data,setData,token,setToken,onBack}){
  const enc = filas[0];
  const montoTotal = filas.reduce((s,r)=>s+r.monto,0);
  const encuestasTotal = filas.reduce((s,r)=>s+r.encuestas,0);
  const multiProyecto = filas.length > 1;

  const [numBoleta,setNum]     = useState(enc.numBoleta||"");
  const [file,setFile]         = useState(null);
  const [uploading,setUpl]     = useState(false);
  const [authLoad,setAuth]     = useState(false);
  const [done,setDone]         = useState(enc.boleta||false);
  const [msg,setMsg]           = useState({text:"",type:""});
  const [tipoCta,setTipoCta]   = useState(enc.tipoCuenta||"");
  const [banco,setBanco]       = useState(enc.banco||"");
  const [numCta,setNumCta]     = useState(enc.numCuenta||"");
  const [ctaSaved,setCtaSaved] = useState(!!(enc.tipoCuenta&&enc.banco&&enc.numCuenta));
  const [modalData,setModal]   = useState(null);
  const fileRef = useRef();
  const pendingUploadRef = useRef(null);

  const vencido  = isVencido(enc.fechaTope);
  const proxima  = isProxima(enc.fechaTope);
  const esRUT    = tipoCta==="RUT";

  const handleTipo = val => {
    setTipoCta(val);
    if(val==="RUT"){ setBanco("ESTADO"); setNumCta(rutSinDigito(enc.rut)); }
    else{ setBanco(""); setNumCta(""); }
  };

  const handleFile=e=>{const f=e.target.files[0];if(f&&f.type==="application/pdf"){setFile(f);setMsg({text:"",type:""});}else setMsg({text:"Solo se admiten archivos PDF.",type:"warning"});};

  const confirmarSubida = async () => {
    const {tok, fileBuffer, fileName, mes, verif} = pendingUploadRef.current;
    setModal(null);
    setUpl(true);
    try{
      setMsg({text:"Subiendo boleta a Google Drive...",type:"info"});
      await uploadPDF(tok, fileBuffer, fileName, mes);
      setDone(true);
      setMsg({text:"Boleta guardada con advertencias en Google Drive/"+FOLDER_ROOT+"/"+mes,type:"success"});
      setData(data.map(r=>r.rut===enc.rut?{...r,boleta:true,numBoleta:numBoleta.trim()}:r));
    }catch(e){setMsg({text:"Error al subir: "+e.message,type:"danger"});}
    setUpl(false);
  };

  const cancelarSubida = () => {
    setModal(null);
    setMsg({text:"Subida cancelada. Revisa los datos de la boleta.",type:"warning"});
  };

  const guardarCuenta=()=>{
    if(!tipoCta){setMsg({text:"Selecciona el tipo de cuenta.",type:"warning"});return;}
    if(!esRUT&&!banco){setMsg({text:"Selecciona el banco.",type:"warning"});return;}
    if(!numCta.trim()){setMsg({text:"Ingresa el número de cuenta.",type:"warning"});return;}
    setCtaSaved(true);
    setMsg({text:"",type:""});
    setData(data.map(r=>r.rut===enc.rut?{...r,tipoCuenta:tipoCta,banco,numCuenta:numCta}:r));
  };

  const handleSubir=async()=>{
    if(!ctaSaved){setMsg({text:"Guarda tus datos bancarios primero.",type:"warning"});return;}
    if(!numBoleta.trim()){setMsg({text:"Ingresa el número de boleta.",type:"warning"});return;}
    if(!file){setMsg({text:"Selecciona un archivo PDF.",type:"warning"});return;}
    let tok=token;
    if(!tok){
      setMsg({text:"El administrador debe conectar Google Drive antes de que puedas subir tu boleta. Contacta a "+JEFE+" ("+TELEFONO+")",type:"warning"});
      return;
    }
    setUpl(true);
    try{
      const mes=getMesCarpeta(),nombre=enc.nombre.replace(/\s+/g,"_"),fileName=`${enc.rut}_${numBoleta.trim()}_${nombre}.pdf`;
      const fileBuffer = await file.arrayBuffer();

      // Verificar boleta con IA
      setMsg({text:"Verificando boleta con IA...",type:"info"});
      const apiKey = loadFromStorage("anthropic_key","");
      const verif = await verificarBoleta(fileBuffer, montoTotal, numBoleta.trim(), apiKey);

      if(!verif.ok && !verif.omitida){
        // Show custom modal instead of window.confirm
        pendingUploadRef.current = {tok, fileBuffer, fileName, mes, verif};
        setModal(verif.errores);
        setUpl(false);
        return;
      }

      setMsg({text:"Subiendo boleta a Google Drive...",type:"info"});
      await uploadPDF(tok, fileBuffer, fileName, mes);
      setDone(true);
      const msgExito = verif.omitida
        ? `Boleta guardada en Google Drive/${FOLDER_ROOT}/${mes}`
        : verif.ok
          ? `✓ Boleta verificada y guardada en Google Drive/${FOLDER_ROOT}/${mes}`
          : `Boleta guardada con advertencias en Google Drive/${FOLDER_ROOT}/${mes}`;
      setMsg({text:msgExito,type:"success"});
      setData(data.map(r=>r.rut===enc.rut?{...r,boleta:true,numBoleta:numBoleta.trim()}:r));
      // Also update guardarCuenta rows

    }catch(e){setMsg({text:"Error al subir: "+e.message,type:"danger"});}
    setUpl(false);
  };

  const initials=enc.nombre.split(" ").map(n=>n[0]).slice(0,2).join("");

  return(<>
    <header className="site-header">
      <div className="logo"><div className="logo-icon"><i className="ti ti-report-money" style={{fontSize:18,color:"white"}} aria-hidden="true"></i></div>Portal Honorarios</div>
      <button className="btn btn-ghost btn-sm" onClick={onBack}><i className="ti ti-arrow-left" aria-hidden="true"></i> Volver</button>
    </header>
    <div className="page" style={{maxWidth:640}}>

      {/* Banner empresa */}
      <div className="info-banner">
        <div className="periodo">Período de pago</div>
        <div className="empresa-name">Asesorías Y Gestión Enfoque Spa · {enc.periodo||getMesCarpeta().replace("_"," ")}</div>
      </div>

      {/* Alerta fecha tope */}
      {enc.fechaTope&&vencido&&(
        <div className="deadline-banner">
          <i className="ti ti-lock" style={{fontSize:20,flexShrink:0}} aria-hidden="true"></i>
          <div>
            <strong>Plazo de recepción vencido</strong>
            <p style={{fontSize:13,marginTop:3}}>El plazo para enviar boletas venció el {formatFechaTope(enc.fechaTope)}. Debes contactarte con tu coordinador.</p>
            <div style={{marginTop:10,display:"flex",flexDirection:"column",gap:6}}>
              <div style={{display:"flex",alignItems:"center",gap:8,fontSize:13}}><i className="ti ti-user" style={{fontSize:14}} aria-hidden="true"></i><span>{JEFE} · <a href={`tel:${TELEFONO}`} style={{color:"#fca5a5"}}>{TELEFONO}</a> · <a href={`mailto:${CORREO}`} style={{color:"#fca5a5"}}>{CORREO}</a></span></div>
            </div>
          </div>
        </div>
      )}
      {enc.fechaTope&&!vencido&&proxima&&(
        <div className="deadline-banner proxima">
          <i className="ti ti-clock" style={{fontSize:20,flexShrink:0}} aria-hidden="true"></i>
          <div><strong>Plazo próximo a vencer</strong><p style={{fontSize:13,marginTop:3}}>Fecha límite: {formatFechaTope(enc.fechaTope)}</p></div>
        </div>
      )}
      {enc.fechaTope&&!vencido&&!proxima&&(
        <div className="alert alert-info" style={{marginBottom:"1rem"}}>
          <i className="ti ti-calendar" aria-hidden="true"></i>
          <span>Fecha límite de entrega: <strong>{formatFechaTope(enc.fechaTope)}</strong></span>
        </div>
      )}

      {/* Encabezado encuestador */}
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:"1.5rem"}}>
        <div className="avatar">{initials}</div>
        <div><h1 style={{fontSize:20,fontWeight:600}}>{enc.nombre}</h1><p className="muted"><code>{enc.rut}</code> · {enc.proyecto}</p></div>
      </div>

      {/* Contrato */}
      {!enc.contrato&&(
        <div className="alert alert-warning" style={{marginBottom:"1rem"}}>
          <i className="ti ti-alert-triangle" aria-hidden="true"></i>
          <div>
            <strong>Contrato de honorarios pendiente</strong>
            <p style={{marginTop:4,fontSize:13}}>Aún no tienes firmado tu contrato. Debes contactarte con el jefe de campo.</p>
            <div className="contact-box" style={{marginTop:10}}>
              <div className="contact-row"><i className="ti ti-user" style={{fontSize:15}} aria-hidden="true"></i><span><strong>Jefe de campo:</strong> {JEFE}</span></div>
              <div className="contact-row"><i className="ti ti-phone" style={{fontSize:15}} aria-hidden="true"></i><span><strong>Teléfono:</strong> <a href={`tel:${TELEFONO}`} style={{color:"var(--amber)"}}>{TELEFONO}</a></span></div>
              <div className="contact-row"><i className="ti ti-mail" style={{fontSize:15}} aria-hidden="true"></i><span><strong>Correo:</strong> <a href={`mailto:${CORREO}`} style={{color:"var(--amber)"}}>{CORREO}</a></span></div>
            </div>
          </div>
        </div>
      )}
      {enc.contrato&&<div className="alert alert-success" style={{marginBottom:"1rem"}}><i className="ti ti-circle-check" aria-hidden="true"></i><span>Al día con la firma del contrato de honorarios.</span></div>}

      {/* Detalle pago */}
      <div className="card" style={{marginBottom:"1rem"}}>
        <p className="section-title">Detalle de pago</p>
        <div className="stat-grid" style={{marginBottom:"1rem"}}>
          <div className="stat-card"><div className="stat-label">Monto total a cobrar</div><div className="stat-value">${montoTotal.toLocaleString("es-CL")}</div></div>
          <div className="stat-card"><div className="stat-label">Total encuestas</div><div className="stat-value">{encuestasTotal}</div></div>
        </div>
        {multiProyecto?(
          <div>
            <p style={{fontSize:13,fontWeight:600,color:"var(--gray-muted)",marginBottom:8}}>Detalle por proyecto:</p>
            {filas.map((f,i)=>(
              <div key={i} style={{background:"var(--blue-light)",borderRadius:"var(--radius)",padding:"10px 14px",marginBottom:8}}>
                <p style={{fontWeight:600,color:"var(--blue)",fontSize:14}}>{f.proyecto}</p>
                <p style={{fontSize:13,color:"var(--gray-muted)",marginTop:2}}>{f.encuestas} encuestas · ${f.monto.toLocaleString("es-CL")}</p>
              </div>
            ))}
          </div>
        ):(
          <div className="stat-card" style={{background:"var(--blue-light)"}}>
            <div className="stat-label" style={{color:"var(--blue)"}}>Proyecto</div>
            <div style={{fontWeight:500,marginTop:4,color:"var(--blue)"}}>{enc.proyecto}</div>
          </div>
        )}
      </div>

      {/* Datos tributarios */}
      <div className="card" style={{marginBottom:"1rem"}}>
        <p className="section-title"><i className="ti ti-building" style={{marginRight:6,color:"var(--blue)"}} aria-hidden="true"></i>Datos tributarios para emitir boleta</p>
        <p className="muted" style={{marginBottom:"0.75rem"}}>Emite tu boleta de honorarios a nombre de:</p>
        <div style={{background:"#faf9f6",border:"1px solid var(--gray-border)",borderRadius:"var(--radius)",padding:"14px 16px"}}>
          <p style={{fontWeight:600,fontSize:15,marginBottom:6}}>{enc.empresa}</p>
          <p className="muted"><strong>RUT:</strong> {enc.empresaRUT}</p>
          {enc.empresaDir&&<p className="muted"><strong>Dirección:</strong> {enc.empresaDir}</p>}
        </div>
      </div>

      {/* Datos bancarios */}
      <div className="card" style={{marginBottom:"1rem"}}>
        <p className="section-title"><i className="ti ti-building-bank" style={{marginRight:6,color:"var(--blue)"}} aria-hidden="true"></i>Datos bancarios para el pago</p>
        {ctaSaved?(
          <div className="alert alert-success">
            <i className="ti ti-circle-check" aria-hidden="true"></i>
            <div>
              <strong>Datos bancarios guardados</strong>
              <p style={{fontSize:13,marginTop:2}}>{banco} · {tipoCta} · N° {numCta}</p>
              <button className="btn btn-sm" style={{marginTop:8}} onClick={()=>setCtaSaved(false)}><i className="ti ti-edit" aria-hidden="true"></i> Editar</button>
            </div>
          </div>
        ):(
          <>
            <div className="form-group">
              <label className="form-label">Tipo de cuenta</label>
              <select className="form-input" value={tipoCta} onChange={e=>handleTipo(e.target.value)}>
                <option value="">Selecciona el tipo</option>
                {TIPOS_CUENTA.map(t=><option key={t} value={t}>{t}</option>)}
              </select>
            </div>
            <div className="form-group">
              <label className="form-label">Banco</label>
              <select className="form-input" value={banco} onChange={e=>setBanco(e.target.value)} disabled={esRUT}>
                <option value="">Selecciona el banco</option>
                {BANCOS.map(b=><option key={b} value={b}>{b}</option>)}
              </select>
            </div>
            <div className="form-group">
              <label className="form-label">Número de cuenta</label>
              <input className="form-input" value={numCta} placeholder="Ej: 00012345678" onChange={e=>setNumCta(e.target.value)} disabled={esRUT} />
            </div>
            <button className="btn btn-primary" onClick={guardarCuenta}><i className="ti ti-check" aria-hidden="true"></i> Guardar datos bancarios</button>
          </>
        )}
      </div>

      {/* Subir boleta */}
      <div className="card" style={{marginBottom:"1rem"}}>
        <p className="section-title"><i className="ti ti-cloud-upload" style={{marginRight:6,color:"var(--blue)"}} aria-hidden="true"></i>Subir boleta de honorarios</p>
        {vencido?(
          <div className="alert alert-danger">
            <i className="ti ti-lock" aria-hidden="true"></i>
            <div><strong>Envío bloqueado</strong><p style={{fontSize:13,marginTop:3}}>El plazo de recepción ha vencido. Contáctate con tu coordinador: <strong>{JEFE}</strong> · {TELEFONO} · {CORREO}</p></div>
          </div>
        ):!done?(
          <>
            {!token&&<div className="alert alert-warning" style={{marginBottom:"1rem"}}><i className="ti ti-alert-triangle" aria-hidden="true"></i><span>El administrador debe conectar Google Drive primero. Contacta a <strong>{JEFE}</strong> · {TELEFONO}</span></div>}
            <div className="form-group"><label className="form-label">Número de boleta</label><input className="form-input" value={numBoleta} placeholder="Ej: BOL-2026-001" onChange={e=>setNum(e.target.value)} /></div>
            <div style={{border:"2px dashed rgba(0,0,0,0.15)",borderRadius:"var(--radius-lg)",padding:"2rem 1rem",textAlign:"center",cursor:"pointer",background:"#faf9f6",marginBottom:"1rem"}} onClick={()=>fileRef.current.click()}>
              <i className="ti ti-file-type-pdf" style={{fontSize:36,color:"var(--red)",display:"block",marginBottom:6}} aria-hidden="true"></i>
              {file?<><p style={{fontWeight:500}}>{file.name}</p><p className="muted">{(file.size/1024).toFixed(1)} KB · PDF</p></>:<><p style={{fontWeight:500}}>Seleccionar PDF</p><p className="muted">Solo se admiten archivos PDF</p></>}
              <input ref={fileRef} type="file" accept="application/pdf" style={{display:"none"}} onChange={handleFile} />
            </div>
            <button className="btn btn-primary" style={{width:"100%"}} onClick={handleSubir} disabled={uploading||authLoad}>
              {uploading||authLoad?<><span className="spinner"></span>{authLoad?"Autenticando...":"Subiendo a Google Drive..."}</>:<><i className="ti ti-cloud-upload" aria-hidden="true"></i> Subir boleta a Google Drive</>}
            </button>
          </>
        ):(
          <div className="alert alert-success"><i className="ti ti-circle-check" aria-hidden="true"></i><div><strong>Boleta enviada correctamente</strong><p style={{fontSize:13,marginTop:3}}>N° {numBoleta} · Guardada en Google Drive/{FOLDER_ROOT}/{getMesCarpeta()}</p></div></div>
        )}
        {msg.text&&!done&&!vencido&&<div className={`alert alert-${msg.type}`} style={{marginTop:"0.75rem"}}><i className={`ti ${msg.type==="success"?"ti-check":msg.type==="danger"?"ti-x":"ti-info-circle"}`} aria-hidden="true"></i>{msg.text}</div>}
      </div>

      {/* Modal discrepancias */}
      {modalData&&(
        <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,padding:"1rem"}}>
          <div style={{background:"white",borderRadius:"var(--radius-lg)",padding:"1.5rem",maxWidth:420,width:"100%",boxShadow:"0 20px 60px rgba(0,0,0,0.3)"}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:"1rem"}}>
              <div style={{width:40,height:40,borderRadius:"50%",background:"var(--amber-light)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                <i className="ti ti-alert-triangle" style={{fontSize:20,color:"var(--amber)"}} aria-hidden="true"></i>
              </div>
              <h3 style={{fontSize:16,fontWeight:600}}>Discrepancias en la boleta</h3>
            </div>
            <p style={{fontSize:13,color:"var(--gray-muted)",marginBottom:"0.75rem"}}>La IA detectó los siguientes problemas:</p>
            {modalData.map((e,i)=>(
              <div key={i} style={{background:"var(--amber-light)",borderRadius:"var(--radius)",padding:"10px 14px",marginBottom:8,fontSize:13,color:"var(--amber)"}}>
                <i className="ti ti-x" style={{marginRight:6}} aria-hidden="true"></i>{e}
              </div>
            ))}
            <p style={{fontSize:13,color:"var(--gray-muted)",margin:"1rem 0"}}>¿Deseas subir la boleta de todas formas?</p>
            <div style={{display:"flex",gap:10}}>
              <button className="btn btn-sm" style={{flex:1}} onClick={cancelarSubida}><i className="ti ti-x" aria-hidden="true"></i> Cancelar</button>
              <button className="btn btn-sm btn-primary" style={{flex:1}} onClick={confirmarSubida}><i className="ti ti-upload" aria-hidden="true"></i> Subir igual</button>
            </div>
          </div>
        </div>
      )}

      {/* Contacto siempre visible */}
      <div className="card">
        <p className="section-title"><i className="ti ti-headset" style={{marginRight:6,color:"var(--blue)"}} aria-hidden="true"></i>Contacto jefe de campo</p>
        <div className="contact-box">
          <div className="contact-row"><i className="ti ti-user" style={{fontSize:15}} aria-hidden="true"></i><span><strong>Nombre:</strong> {JEFE}</span></div>
          <div className="contact-row"><i className="ti ti-phone" style={{fontSize:15}} aria-hidden="true"></i><span><strong>Teléfono:</strong> <a href={`tel:${TELEFONO}`} style={{color:"var(--blue)"}}>{TELEFONO}</a></span></div>
          <div className="contact-row"><i className="ti ti-mail" style={{fontSize:15}} aria-hidden="true"></i><span><strong>Correo:</strong> <a href={`mailto:${CORREO}`} style={{color:"var(--blue)"}}>{CORREO}</a></span></div>
        </div>
      </div>

    </div>
  </>);
}

ReactDOM.render(<App />,document.getElementById("root"));
</script>
</body>
</html>
