function getMesCarpeta(){
  const now=new Date(),year=now.getFullYear(),month=String(now.getMonth()+1).padStart(2,"0");
  const mes=now.toLocaleString("es-CL",{month:"long"});
  return `${year}-${month}_${mes.charAt(0).toUpperCase()+mes.slice(1)}`;
}

function rutSinDigito(rut){return String(rut).replace(/\./g,"").split("-")[0].replace(/[^0-9]/g,"").trim();}

function col(row,...keys){
  for(const k of keys){
    if(row[k]!==undefined&&row[k]!==null&&row[k]!=="")return row[k];
    const found=Object.keys(row).find(rk=>rk.trim().toLowerCase()===k.toLowerCase());
    if(found&&row[found]!==undefined&&row[found]!==null&&row[found]!=="")return row[found];
  }
  return "";
}

function parseFechaTope(str){
  if(!str)return null;
  try{
    const clean=String(str).trim().replace(/-/g,"/");
    const parts=clean.split(" ");
    const dp=parts[0].split("/");
    const tp=parts[1]?parts[1].split(":"):[23,59];
    return new Date(dp[2],dp[1]-1,dp[0],tp[0],tp[1]);
  }catch{return null;}
}

function formatFechaTope(str){
  const d=parseFechaTope(str);
  if(!d)return str;
  const dias=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
  const meses=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  const hh=String(d.getHours()).padStart(2,"0");
  const mm=String(d.getMinutes()).padStart(2,"0");
  return `${dias[d.getDay()]} ${d.getDate()} de ${meses[d.getMonth()]} ${d.getFullYear()} a las ${hh}:${mm} hrs`;
}

function isVencido(str){const d=parseFechaTope(str);return d?new Date()>d:false;}
function isProxima(str){
  const d=parseFechaTope(str);
  if(!d)return false;
  const diff=(d-new Date())/(1000*60*60);
  return diff>0&&diff<=24;
}

function parseExcelRows(rows){
  return rows.map(r=>{
    const rut=String(col(r,"Rut","RUT","rut")||"");
    const nombre=String(col(r,"NOMBRE ENCUESTADOR","NOMBRE","Nombre","nombre")||"");
    const proyecto=String(col(r,"PROYECTO","Proyecto","proyecto")||"");
    const periodo=String(col(r,"PERIODO PAGO","PERIODO","Período de Pago","periodo")||"");
    const montoUnit=Number(String(col(r,"MONTO UNITARIO","Monto Unitario","monto_unitario")||"0").replace(/[^0-9.-]/g,""))||0;
    const monto=Number(String(col(r,"MONTO BOLETA","MONTO","Monto","monto","Valor total bruto")||"0").replace(/[^0-9.-]/g,""))||montoUnit||0;
    const encuestas=Number(col(r,"CANTIDAD ENCUESTAS","Cantidad","CANTIDAD","encuestas")||0);
    const empresa=String(col(r,"Empresa","EMPRESA","empresa")||"");
    const empresaRUT=String(col(r,"RUT EMPRESA","Rut Empresa","rut_empresa")||"");
    const empresaDir=String(col(r,"Dirección Empresa","direccion_empresa","DIRECCION")||"");
    const contrato=String(col(r,"Contrato Firmado","contrato_firmado","CONTRATO")||"NO").toUpperCase()==="SI";
    const tipoCuenta=String(col(r,"Tipo Cuenta","TIPO CUENTA","tipo_cuenta")||"").toUpperCase();
    const cuentaRUT=tipoCuenta==="RUT";
    const numCuenta=cuentaRUT?rutSinDigito(rut):String(col(r,"Cuenta","CUENTA","numero_cuenta")||"");
    const banco=cuentaRUT?"ESTADO":String(col(r,"Banco","BANCO","banco")||"");
    const fechaTope=String(col(r,"Fecha Tope","FECHA TOPE","fecha_tope","FechaTope")||"");
    return{rut,nombre,proyecto,periodo,monto,encuestas,empresa,empresaRUT,empresaDir,contrato,cuentaRUT,tipoCuenta,numCuenta,banco,fechaTope,boleta:false,numBoleta:"",boletaUrl:""};
  }).filter(r=>r.rut&&r.nombre);
}

function descargarExcel(data){
  const rows=data.map(r=>({"PROYECTO":r.proyecto,"PERIODO PAGO":r.periodo,"NOMBRE ENCUESTADOR":r.nombre,"Rut":r.rut,"CANTIDAD ENCUESTAS":r.encuestas,"MONTO BOLETA":r.monto,"Empresa":r.empresa,"RUT EMPRESA":r.empresaRUT,"Dirección Empresa":r.empresaDir,"Tipo Cuenta":r.tipoCuenta,"Banco":r.banco,"Cuenta":r.numCuenta,"Contrato Firmado":r.contrato?"SI":"NO","Fecha Tope":r.fechaTope,"N° BOLETA":r.numBoleta,"BOLETA SUBIDA":r.boleta?"SI":"NO"}));
  const ws=XLSX.utils.json_to_sheet(rows);

}

async function savePlanillaGitHub(rows,githubToken){
  try{
    const h={"Authorization":"token "+githubToken,"Content-Type":"application/json"};
    const json=JSON.stringify(rows);
    const base64=btoa(unescape(encodeURIComponent(json)));
    let sha=null;
    try{const r=await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${GITHUB_FILE}`,{headers:h});if(r.ok){const d=await r.json();sha=d.sha;}}catch(_){}
    const body={message:"Actualizar planilla",content:base64};
    if(sha)body.sha=sha;
    const res=await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${GITHUB_FILE}`,{method:"PUT",headers:h,body:JSON.stringify(body)});
    if(res.ok)console.log("Planilla guardada en GitHub");
    else console.warn("Error GitHub:",await res.text());
  }catch(e){console.warn("Error GitHub:",e.message);}
}

async function loadPlanillaGitHub(){
  try{
    const url=`https://raw.githubusercontent.com/${GITHUB_REPO}/main/${GITHUB_FILE}?t=${Date.now()}`;
    const res=await fetch(url);
    if(!res.ok)return null;
    return await res.json();
  }catch(e){console.warn("Error cargando planilla:",e.message);return null;}
}

async function verificarBoleta(fileData,montoEsperado,numBoletaIngresado,apiKey){
  try{
    const bytes=new Uint8Array(fileData);
    let binary='';
    for(let i=0;i<bytes.byteLength;i++)binary+=String.fromCharCode(bytes[i]);
    const base64=btoa(binary);
    const response=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:1000,messages:[{role:"user",content:[{type:"document",source:{type:"base64",media_type:"application/pdf",data:base64}},{type:"text",text:`Analiza esta boleta de honorarios y extrae la siguiente información. Responde SOLO con un JSON válido sin texto adicional ni backticks:\n{\n "numeroBoleta": "número de la boleta encontrado en el documento",\n "monto": el valor del campo Total Honorarios en pesos chilenos (solo el número, sin puntos ni signos). NO uses el campo Total que descuenta impuestos,\n "emisor": "nombre del emisor de la boleta",\n "receptor": "nombre del receptor/empresa"\n}\nSi no puedes encontrar algún dato, usa null para ese campo.`}]}]})
    });
    if(!response.ok)throw new Error("Error en API de verificación");
    const data=await response.json();
    const text=data.content[0].text;
    const clean=text.replace(/```json|```/g,"").trim();
    const resultado=JSON.parse(clean);
    const errores=[];
    if(resultado.numeroBoleta&&String(resultado.numeroBoleta).trim()!==String(numBoletaIngresado).trim()){
      errores.push(`Número de boleta: PDF dice "${resultado.numeroBoleta}", ingresaste "${numBoletaIngresado}"`);
    }
    if(resultado.monto!==null&&resultado.monto!==undefined){
      const montoPDF=Number(String(resultado.monto).replace(/[^0-9]/g,""));
      const diff=Math.abs(montoPDF-montoEsperado);
      if(diff>100)errores.push(`Monto: PDF dice $${montoPDF.toLocaleString("es-CL")}, se esperaba $${montoEsperado.toLocaleString("es-CL")}`);
    }
    return{ok:errores.length===0,errores,resultado};
  }catch(e){
    console.warn("Verificación no disponible:",e.message);
    return{ok:true,errores:[],resultado:null,omitida:true};
  }
}

function loadFromStorage(key,def){try{const v=localStorage.getItem(key);return v?JSON.parse(v):def;}catch(_){return def;}}

    if(!encActivo)return <EncLogin data={data} setData={setData} onOk={e=>setEnc(e)} onBack={()=>setView("home")} />;

    return <EncView filas={filas} data={data} setData={setData} onBack={()=>setEnc(null)} />;
  }
}

function EncLogin({data,setData,onOk,onBack}){
  const [rut,setRut]=useState("");
  const [err,setErr]=useState("");
  const [cargando,setCargando]=useState(false);

  React.useEffect(()=>{
    const init=async()=>{
      setCargando(true);
      try{
        const rows=await loadPlanillaGitHub();
        if(rows&&rows.length>0){
          setData(rows, false);
          // Si ya hay un RUT ingresado, buscar automáticamente con datos frescos
          if(rut.trim()) buscar(rows);
        }
      }catch(_){}
      setCargando(false);
    };
    init();
  },[]);

  const buscar=(datosActuales)=>{
    const d=datosActuales||data;
    if(d.length===0){setErr("El administrador aún no ha cargado la planilla de pagos.");return;}
    const c=rut.trim().toLowerCase().replace(/[\s.]/g,"").replace(/-/g,"");
    const filas=d.filter(r=>{const rc=r.rut.toLowerCase().replace(/[\s.]/g,"").replace(/-/g,"");return rc===c;});
    if(filas.length>0)onOk(filas);
    else setErr("RUT no encontrado. Verifica el formato (ej: 14541963-8)");
  };

  return(<>
    <header className="site-header"><div className="logo"><div className="logo-icon"><i className="ti ti-report-money" style={{fontSize:18,color:"white"}}></i></div>Portal Honorarios</div><button className="btn btn-ghost btn-sm" onClick={onBack}><i className="ti ti-arrow-left"></i> Volver</button></header>
    <div className="page-narrow" style={{marginTop:40}}>
      <div className="card">
        <div style={{textAlign:"center",marginBottom:"1.5rem"}}>
          <div style={{width:48,height:48,borderRadius:"50%",background:"var(--blue-light)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 12px"}}><i className="ti ti-user" style={{fontSize:22,color:"var(--blue)"}}></i></div>
          <h2 style={{fontSize:18,fontWeight:600}}>Portal Encuestador</h2>
          <p className="muted" style={{marginTop:4}}>Ingresa tu RUT para ver tu información de pago</p>
        </div>
        <div className="form-group"><label className="form-label">RUT</label><input className="form-input" value={rut} placeholder="12345678-9" onChange={e=>{setRut(e.target.value);setErr("");}} onKeyDown={e=>e.key==="Enter"&&buscar()} />{err&&<span className="form-error">{err}</span>}</div>
        {cargando&&<div className="alert alert-info" style={{marginBottom:"0.75rem"}}><i className="ti ti-loader"></i><span>Sincronizando datos... espera un momento</span></div>}
        <button className="btn btn-primary" style={{width:"100%"}} onClick={()=>buscar(null)} disabled={cargando}>
          {cargando?<><span className="spinner"></span> Cargando...</>:<><i className="ti ti-login"></i> Ver mi información</>}
        </button>
      </div>
    </div>
  </>);
}

function EncView({filas,data,setData,onBack}){
  const enc=filas[0];
  const montoTotal=filas.reduce((s,r)=>s+r.monto,0);
  const encuestasTotal=filas.reduce((s,r)=>s+r.encuestas,0);
  const multiProyecto=filas.length>1;
  const proyectosStr=filas.map(f=>f.proyecto).filter(Boolean).join(", ")||"-";
  const initials=enc.nombre.split(" ").map(n=>n[0]).slice(0,2).join("");

  const [numBoleta,setNum]=useState(enc.numBoleta||"");
  const numBoletaRef=useRef(enc.numBoleta||"");
  const [uploading,setUpl]=useState(false);
  const [done,setDone]=useState(enc.boleta||false);
  const [msg,setMsg]=useState({text:"",type:""});
  const [tipoCta,setTipoCta]=useState(enc.tipoCuenta||"");
  const [banco,setBanco]=useState(enc.banco||"");
  const [numCta,setNumCta]=useState(enc.numCuenta||"");
  const [ctaSaved,setCtaSaved]=useState(!!(enc.tipoCuenta&&enc.banco&&enc.numCuenta));
  const [modalData,setModal]=useState(null);
  const fileRef=useRef();

  const vencido=isVencido(enc.fechaTope);
  const proxima=isProxima(enc.fechaTope);
  const esRUT=tipoCta==="RUT";

  const handleTipo=val=>{
    setTipoCta(val);
    if(val==="RUT"){setBanco("ESTADO");setNumCta(rutSinDigito(enc.rut));}
    else{setBanco("");setNumCta("");}
  };

  const guardarCuenta=()=>{
    if(!tipoCta){setMsg({text:"Selecciona el tipo de cuenta.",type:"warning"});return;}
    if(!esRUT&&!banco){setMsg({text:"Selecciona el banco.",type:"warning"});return;}
    if(!numCta.trim()){setMsg({text:"Ingresa el número de cuenta.",type:"warning"});return;}
    const updated=data.map(r=>r.rut===enc.rut?{...r,tipoCuenta:tipoCta,banco,numCuenta:numCta}:r);
    setData(updated);
    setCtaSaved(true);
    setMsg({text:"",type:""});
  };

  const handleFile=async(e)=>{
    const f=e.target.files[0];
    if(!f)return;
    if(f.type!=="application/pdf"){setMsg({text:"Solo se aceptan archivos PDF.",type:"danger"});return;}
    if(f.size>5*1024*1024){setMsg({text:"El archivo no debe superar 5MB.",type:"danger"});return;}
    const boletaNum=numBoletaRef.current||numBoleta;
    if(!boletaNum.trim()){setMsg({text:"Ingresa el número de boleta antes de subir el archivo.",type:"danger"});return;}
    if(vencido){setMsg({text:"La fecha límite ha vencido. No puedes subir la boleta.",type:"danger"});return;}
    setUpl(true);
    setMsg({text:"",type:""});
    try{
      const fileData=await f.arrayBuffer();
      const apiKey=loadFromStorage("anthropic_key","");
      if(apiKey){
        setMsg({text:"Verificando boleta con IA...",type:"info"});
        const ver=await verificarBoleta(fileData,montoTotal,boletaNum,apiKey);
        if(!ver.omitida&&!ver.ok){setUpl(false);setModal({errores:ver.errores});return;}
      }
      setMsg({text:"Enviando boleta por email...",type:"info"});
      const fileName="Boleta_"+enc.nombre.replace(/\s+/g,"_")+"_"+boletaNum+".pdf";
      const emailResult=await enviarBoletaEmail(enc,montoTotal,proyectosStr,boletaNum,fileData,fileName);
      if(!emailResult.ok){setMsg({text:"Error al enviar: "+emailResult.error,type:"danger"});setUpl(false);return;}
      const updated=data.map(r=>r.rut===enc.rut?{...r,boleta:true,numBoleta:boletaNum,boletaUrl:"email"}:r);
      setData(updated);
      // Actualizar también el historial para que la planilla activa refleje la boleta
      try{
        const hist=JSON.parse(localStorage.getItem("planilla_historial")||"[]");
        const histUpd=hist.map(p=>p.activa?{...p,rows:p.rows.map(r=>r.rut===enc.rut?{...r,boleta:true,numBoleta:boletaNum,boletaUrl:"email"}:r)}:p);
        localStorage.setItem("planilla_historial",JSON.stringify(histUpd));
      }catch(_){}
      setDone(true);
      setMsg({text:"Boleta enviada correctamente a f2f@enfoque360.cl",type:"success"});
    }catch(err){setMsg({text:"Error inesperado: "+err.message,type:"danger"});}
    setUpl(false);
    e.target.value="";
  };

  return(<>
    <header className="site-header">
      <div className="logo"><div className="logo-icon"><i className="ti ti-report-money" style={{fontSize:18,color:"white"}}></i></div>Portal Honorarios</div>
      <button className="btn btn-ghost btn-sm" onClick={onBack}><i className="ti ti-arrow-left"></i> Volver</button>
    </header>

    {modalData&&(
      <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:999,display:"flex",alignItems:"center",justifyContent:"center",padding:"1rem"}}>
        <div className="card" style={{maxWidth:420,width:"100%"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:"1rem"}}>
            <div style={{width:40,height:40,borderRadius:"50%",background:"var(--red-light)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><i className="ti ti-alert-triangle" style={{fontSize:20,color:"var(--red)"}}></i></div>
            <div><p style={{fontWeight:600,color:"var(--red)"}}>Boleta incorrecta</p><p style={{fontSize:13,color:"var(--gray-muted)"}}>La IA detectó los siguientes problemas:</p></div>
          </div>
          {modalData.errores.map((e,i)=><div key={i} className="alert alert-danger" style={{marginBottom:8}}><i className="ti ti-x"></i><span>{e}</span></div>)}
          <p style={{fontSize:13,color:"var(--gray-muted)",margin:"1rem 0 0.75rem"}}>Debes subir la boleta correcta. Si crees que es un error, contacta al jefe de campo.</p>
          <button className="btn btn-primary" style={{width:"100%"}} onClick={()=>setModal(null)}><i className="ti ti-arrow-left"></i> Volver y corregir</button>
        </div>
      </div>
    )}

    <div className="page" style={{maxWidth:640}}>

      <div className="info-banner">
        <div className="periodo">Período de pago</div>
        <div className="empresa-name">Asesorías Y Gestión Enfoque Spa · {(enc.periodo||getMesCarpeta().replace("_"," ")).toUpperCase()}</div>
      </div>

      {enc.fechaTope&&vencido&&<div className="deadline-banner"><i className="ti ti-lock" style={{fontSize:20,flexShrink:0}}></i><div><strong>Plazo de recepción vencido</strong><p style={{fontSize:13,marginTop:3}}>El plazo venció el {formatFechaTope(enc.fechaTope)}.</p></div></div>}
      {enc.fechaTope&&!vencido&&proxima&&<div className="deadline-banner proxima"><i className="ti ti-clock" style={{fontSize:20,flexShrink:0}}></i><div><strong>¡Plazo próximo a vencer!</strong><p style={{fontSize:13,marginTop:3}}>Fecha límite: {formatFechaTope(enc.fechaTope)}</p></div></div>}
      {enc.fechaTope&&!vencido&&!proxima&&<div className="alert alert-info" style={{marginBottom:"1rem"}}><i className="ti ti-calendar"></i><span>Fecha límite de entrega: <strong>{formatFechaTope(enc.fechaTope)}</strong></span></div>}

      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:"1.5rem"}}>
        <div className="avatar">{initials}</div>
        <div>
          <h1 style={{fontSize:20,fontWeight:600}}>{enc.nombre}</h1>
          <p className="muted"><code>{enc.rut}</code></p>
        </div>
      </div>

      {!enc.contrato&&<div className="alert alert-warning" style={{marginBottom:"1rem"}}><i className="ti ti-alert-triangle"></i><div><strong>Contrato de honorarios pendiente</strong><p style={{marginTop:4,fontSize:13}}>Aún no tienes firmado tu contrato. Contacta al jefe de campo.</p></div></div>}
      {enc.contrato&&<div className="alert alert-success" style={{marginBottom:"1rem"}}><i className="ti ti-circle-check"></i><span>Al día con la firma del contrato de honorarios.</span></div>}

      <div className="card" style={{marginBottom:"1rem"}}>
        <p className="section-title">Detalle de pago</p>
        <div className="stat-grid" style={{marginBottom:"1rem"}}>
          <div className="stat-card"><div className="stat-label">Monto total a cobrar</div><div className="stat-value" style={{fontSize:26,color:"var(--blue-dark)"}}>${montoTotal.toLocaleString("es-CL")}</div></div>
          <div className="stat-card"><div className="stat-label">Total encuestas</div><div className="stat-value">{encuestasTotal}</div></div>
        </div>
        {multiProyecto?(
          <div>
            <p style={{fontSize:13,fontWeight:500,marginBottom:8,color:"var(--gray-muted)"}}>Detalle por proyecto:</p>
            {filas.map((f,i)=>(
              <div key={i} style={{background:"var(--blue-light)",borderRadius:"var(--radius)",padding:"10px 14px",marginBottom:6}}>
                <div style={{fontWeight:600,color:"var(--blue)",fontSize:14}}>{f.proyecto}</div>
                <div style={{fontSize:13,color:"var(--blue)",opacity:0.8,marginTop:2}}>{f.encuestas} encuestas · ${f.monto.toLocaleString("es-CL")}</div>
              </div>
            ))}
          </div>
        ):(
          <div style={{background:"var(--blue-light)",borderRadius:"var(--radius)",padding:"10px 14px",marginBottom:"0.5rem"}}>
            <div style={{fontWeight:600,color:"var(--blue)",fontSize:14}}>{enc.proyecto}</div>
            <div style={{fontSize:13,color:"var(--blue)",opacity:0.8,marginTop:2}}>{enc.encuestas} encuestas</div>
          </div>
        )}
        <div style={{background:"var(--blue-dark)",borderRadius:"var(--radius)",padding:"16px",textAlign:"center",marginTop:"1rem"}}>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.7)",letterSpacing:"0.05em",textTransform:"uppercase",marginBottom:4}}>Monto total a emitir en boleta</div>
          <div style={{fontSize:32,fontWeight:700,color:"white",letterSpacing:"-1px"}}>${montoTotal.toLocaleString("es-CL")}</div>
        </div>
      </div>

      {enc.empresa&&<div className="card" style={{marginBottom:"1rem"}}>
        <p className="section-title"><i className="ti ti-building" style={{marginRight:6,color:"var(--blue)"}}></i>Datos tributarios para emitir boleta</p>
        <p className="muted" style={{marginBottom:"0.75rem"}}>Emite tu boleta de honorarios a nombre de:</p>
        <div style={{background:"#faf9f6",border:"1px solid var(--gray-border)",borderRadius:"var(--radius)",padding:"14px 16px"}}>
          <p style={{fontWeight:600,fontSize:15,marginBottom:6}}>{enc.empresa}</p>
          {enc.empresaRUT&&<p className="muted"><strong>RUT:</strong> {enc.empresaRUT}</p>}
          {enc.empresaDir&&<p className="muted"><strong>Dirección:</strong> {enc.empresaDir}</p>}
        </div>
      </div>}

      <div className="card" style={{marginBottom:"1rem"}}>
        <p className="section-title"><i className="ti ti-building-bank" style={{marginRight:6,color:"var(--blue)"}}></i>Datos bancarios para el pago</p>
        {ctaSaved?(
          <div className="alert alert-success">
            <i className="ti ti-circle-check"></i>
            <div>
              <strong>Datos bancarios guardados</strong>
              <p style={{fontSize:13,marginTop:2}}>{enc.banco||banco} · {enc.tipoCuenta||tipoCta} · N° {enc.numCuenta||numCta}</p>
              <button className="btn btn-sm" style={{marginTop:8}} onClick={()=>setCtaSaved(false)}><i className="ti ti-edit"></i> Editar</button>
            </div>
          </div>
        ):(
          <div>
            <div className="form-group"><label className="form-label">Tipo de cuenta</label>
              <select className="form-input" value={tipoCta} onChange={e=>handleTipo(e.target.value)}>
                <option value="">Selecciona tipo...</option>
                {TIPOS_CUENTA.map(t=><option key={t} value={t}>{t}</option>)}
              </select>
            </div>
            {!esRUT&&<div className="form-group"><label className="form-label">Banco</label>
              <select className="form-input" value={banco} onChange={e=>setBanco(e.target.value)}>
                <option value="">Selecciona banco...</option>
                {BANCOS.map(b=><option key={b} value={b}>{b}</option>)}
              </select>
            </div>}
            <div className="form-group"><label className="form-label">Número de cuenta</label>
              <input className="form-input" value={numCta} placeholder="Ej: 12345678" onChange={e=>setNumCta(e.target.value)} disabled={esRUT} />
            </div>
            <button className="btn btn-primary" onClick={guardarCuenta}><i className="ti ti-check"></i> Guardar datos bancarios</button>
          </div>
        )}
      </div>

      <div className="card" style={{marginBottom:"1rem"}}>
        <p className="section-title"><i className="ti ti-mail" style={{marginRight:6}}></i>Enviar boleta</p>
        {done?(
          <div className="alert alert-success"><i className="ti ti-circle-check"></i><div><strong>¡Boleta enviada correctamente!</strong><p style={{fontSize:13,marginTop:3}}>N° {enc.numBoleta} enviada a <code>f2f@enfoque360.cl</code></p></div></div>
        ):(
          <div>
            <div className="alert alert-info" style={{marginBottom:"1rem"}}><i className="ti ti-info-circle"></i><span style={{fontSize:13}}>Tu boleta se enviará automáticamente a <strong>f2f@enfoque360.cl</strong>. No necesitas iniciar sesión en ningún servicio.</span></div>
            <div className="form-group"><label className="form-label">Número de boleta</label>
              <input className="form-input" value={numBoleta} placeholder="Ej: 123456" onChange={e=>{setNum(e.target.value);numBoletaRef.current=e.target.value;}} disabled={uploading} />
            </div>
            <div className="upload-zone" style={{opacity:vencido?0.5:1,pointerEvents:vencido?"none":"auto"}} onClick={()=>!uploading&&fileRef.current.click()}>
              <i className="ti ti-file-type-pdf" style={{fontSize:36,color:"var(--blue)",display:"block",marginBottom:8}}></i>
              <p style={{fontWeight:500,marginBottom:4}}>{uploading?"Procesando...":"Toca para adjuntar tu boleta PDF"}</p>
              <p className="muted" style={{fontSize:12}}>Máximo 5MB · Solo PDF</p>
              <input ref={fileRef} type="file" accept="application/pdf" style={{display:"none"}} onChange={handleFile} disabled={uploading} />
            </div>
            {uploading&&<div className="alert alert-info" style={{marginTop:"0.75rem"}}><i className="ti ti-loader"></i><span>Procesando y enviando boleta...</span></div>}
          </div>
        )}
        {msg.text&&<div className={"alert alert-"+msg.type} style={{marginTop:"0.75rem"}}><i className={"ti ti-"+(msg.type==="success"?"circle-check":msg.type==="info"?"info-circle":"alert-triangle")}></i><span>{msg.text}</span></div>}
      </div>

      <div className="contact-box" style={{marginBottom:"2rem"}}>
        <div className="contact-row"><i className="ti ti-user" style={{fontSize:15}}></i><span>Jefe de campo: <strong>{JEFE}</strong></span></div>
        <div className="contact-row"><i className="ti ti-phone" style={{fontSize:15}}></i><a href={"tel:+56"+TELEFONO} style={{color:"var(--blue)",textDecoration:"none"}}><strong>+56 {TELEFONO}</strong></a></div>
        <div className="contact-row"><i className="ti ti-mail" style={{fontSize:15}}></i><a href={"mailto:"+CORREO} style={{color:"var(--blue)",textDecoration:"none"}}>{CORREO}</a></div>
      </div>
    </div>
  </>);
}


const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
