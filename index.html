    display: inline-flex; align-items: center; gap: 7px;

<script type="text/babel">
const { useState, useRef } = React;

// ─── CONFIG ──────────────────────────────────────────────────────────────────
const CLIENT_ID    = "256837b8-0718-4669-a33d-19dda2bb111e";

const FOLDER_ROOT  = "Boletas_Honorarios";

function getRedirectUri() {
  return window.location.origin + window.location.pathname.replace(/\/$/, "");
}

function getMesCarpeta() {
  const now = new Date();
  const year  = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, "0");
  const mes   = now.toLocaleString("es-CL", { month: "long" });
  return `${year}-${month}_${mes.charAt(0).toUpperCase() + mes.slice(1)}`;
}

// ─── MICROSOFT AUTH (popup implicit flow) ────────────────────────────────────
async function getToken() {
  return new Promise((resolve, reject) => {
    const redirectUri = getRedirectUri();
    const url =
      `https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/authorize` +
      `?client_id=${CLIENT_ID}` +
      `&response_type=token` +
      `&redirect_uri=${encodeURIComponent(redirectUri)}` +
      `&scope=${encodeURIComponent("Files.ReadWrite.All User.Read")}` +
      `&response_mode=fragment` +
      `&prompt=select_account`;

    const popup = window.open(url, "msauth", "width=520,height=660,left=200,top=80");
    if (!popup) { reject(new Error("El navegador bloqueó la ventana emergente. Permite popups para este sitio.")); return; }

    const timer = setInterval(() => {
      try {
        if (!popup || popup.closed) { clearInterval(timer); reject(new Error("Ventana cerrada antes de autenticar.")); return; }
        const hash = popup.location.hash;
        if (hash.includes("access_token")) {
          clearInterval(timer);
          popup.close();
          const p = new URLSearchParams(hash.slice(1));
          resolve(p.get("access_token"));
        }
        if (hash.includes("error=")) {
          clearInterval(timer);
          popup.close();
          const p = new URLSearchParams(hash.slice(1));
          reject(new Error(p.get("error_description") || "Error de autenticación"));
        }
      } catch (_) {}
    }, 600);

    setTimeout(() => { clearInterval(timer); try { popup.close(); } catch(_){} reject(new Error("Tiempo de espera agotado.")); }, 180000);
  });
}

// ─── ONEDRIVE HELPERS ─────────────────────────────────────────────────────────
async function graphFetch(token, path, options = {}) {
  const res = await fetch(`https://graph.microsoft.com/v1.0${path}`, {
    ...options,
    headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json", ...(options.headers || {}) }
  });
  return res;
}

async function ensureFolders(token, mesCarpeta) {
  // Crear carpeta raíz
  await graphFetch(token, "/me/drive/root/children", {
    method: "POST",
    body: JSON.stringify({ name: FOLDER_ROOT, folder: {}, "@microsoft.graph.conflictBehavior": "replace" })
  });
  // Crear subcarpeta mes
  await graphFetch(token, `/me/drive/root:/${FOLDER_ROOT}:/children`, {
    method: "POST",
    body: JSON.stringify({ name: mesCarpeta, folder: {}, "@microsoft.graph.conflictBehavior": "replace" })
  });
}

async function uploadPDF(token, fileData, fileName, mesCarpeta) {
  await ensureFolders(token, mesCarpeta);
  const path = `/${FOLDER_ROOT}/${mesCarpeta}/${fileName}`;
  const res = await fetch(`https://graph.microsoft.com/v1.0/me/drive/root:${path}:/content`, {
    method: "PUT",
    headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/pdf" },
    body: fileData
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err?.error?.message || `Error ${res.status}`);
  }
  return await res.json();
}

// ─── SAMPLE DATA ──────────────────────────────────────────────────────────────
const SAMPLE = [
  { rut:"12345678-9", nombre:"María González",   proyecto:"Encuesta Nacional Salud",  monto:185000, encuestas:12, empresa:"Consultora ABC SpA",   empresaRUT:"76.123.456-7", empresaDir:"Av. Providencia 1234, Santiago",     contrato:true,  boleta:false, numBoleta:"", boletaUrl:"" },
  { rut:"98765432-1", nombre:"Carlos Méndez",    proyecto:"Estudio Educación 2026",    monto:220000, encuestas:15, empresa:"DataSurveys Ltda.",     empresaRUT:"77.654.321-0", empresaDir:"Calle Los Leones 456, Las Condes",   contrato:false, boleta:false, numBoleta:"", boletaUrl:"" },
  { rut:"11223344-5", nombre:"Ana Torres",       proyecto:"Encuesta Nacional Salud",  monto:160000, encuestas:10, empresa:"Consultora ABC SpA",   empresaRUT:"76.123.456-7", empresaDir:"Av. Providencia 1234, Santiago",     contrato:true,  boleta:true,  numBoleta:"BOL-2026-001", boletaUrl:"" },
];

// ─── ROOT APP ────────────────────────────────────────────────────────────────
function App() {
  const [view,       setView]   = useState("home");
  const [adminAuth,  setAdmin]  = useState(false);
  const [encActivo,  setEnc]    = useState(null);
  const [data,       setData]   = useState(SAMPLE);
  const [odToken,    setToken]  = useState(null);

  if (view === "home") return <Home onAdmin={() => setView("admin")} onEnc={() => setView("encuestador")} />;

  if (view === "admin") {
    if (!adminAuth) return <AdminLogin onOk={() => setAdmin(true)} onBack={() => setView("home")} />;
    return <AdminPanel data={data} setData={setData} token={odToken} setToken={setToken} onLogout={() => { setAdmin(false); setView("home"); }} />;
  }

  if (view === "encuestador") {
    if (!encActivo) return <EncLogin data={data} onOk={e => setEnc(e)} onBack={() => setView("home")} />;
    const enc = data.find(r => r.rut === encActivo.rut);
    return <EncView enc={enc} data={data} setData={setData} token={odToken} setToken={setToken} onBack={() => setEnc(null)} />;
  }
}

// ─── ADMIN PANEL ──────────────────────────────────────────────────────────────
function AdminPanel({ data, setData, token, setToken, onLogout }) {
  const [tab,        setTab]    = useState("resumen");
  const [excelMsg,   setXlsMsg] = useState("");
  const [connecting, setConn]   = useState(false);
  const fileRef = useRef();
  const mes = getMesCarpeta();

  const totalMonto    = data.reduce((s,r) => s + r.monto, 0);
  const sinContrato   = data.filter(r => !r.contrato).length;
  const boletasOk     = data.filter(r => r.boleta).length;

  const handleExcel = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const wb = XLSX.read(ev.target.result, { type:"binary" });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws);
        const parsed = rows.map(r => ({
          rut:         String(r["RUT"]              || r["rut"]              || ""),
          nombre:      String(r["Nombre"]           || r["nombre"]           || ""),
          proyecto:    String(r["Proyecto"]         || r["proyecto"]         || ""),
          monto:       Number(r["Monto"]            || r["monto"]            || 0),
          encuestas:   Number(r["Encuestas"]        || r["encuestas"]        || r["Cantidad Encuestas"] || 0),
          empresa:     String(r["Empresa"]          || r["empresa"]          || ""),
          empresaRUT:  String(r["RUT Empresa"]      || r["rut_empresa"]      || ""),
          empresaDir:  String(r["Dirección Empresa"]|| r["direccion_empresa"]|| ""),
          contrato:    String(r["Contrato Firmado"] || r["contrato_firmado"] || "NO").toUpperCase() === "SI",
          boleta:false, numBoleta:"", boletaUrl:"",
        }));
        setData(parsed);
        setXlsMsg(`✓ ${parsed.length} encuestadores cargados`);
      } catch { setXlsMsg("Error al leer el archivo. Revisa el formato."); }
    };
    reader.readAsBinaryString(file);
  };

  const conectar = async () => {
    setConn(true);
    try {
      const t = await getToken();
      setToken(t);
      await ensureFolders(t, mes);
    } catch(e) { alert("Error al conectar: " + e.message); }
    setConn(false);
  };

  return (
    <>
      <header className="site-header">
        <div className="logo"><div className="logo-icon"><i className="ti ti-report-money" style={{fontSize:18,color:"white"}} aria-hidden="true"></i></div>Portal Honorarios</div>

          {token
            ? <span className="badge badge-success" style={{fontSize:11}}><i className="ti ti-brand-onedrive" aria-hidden="true"></i> OneDrive activo</span>
            : <span className="badge badge-warning" style={{fontSize:11}}><i className="ti ti-brand-onedrive" aria-hidden="true"></i> Sin conectar</span>}
          <button className="btn btn-ghost btn-sm" onClick={onLogout}><i className="ti ti-logout" aria-hidden="true"></i> Salir</button>
        </div>
      </header>

      <div className="page">
        <div style={{marginBottom:"1.5rem"}}>
          <h1 style={{fontSize:20,fontWeight:600}}>Panel de administración</h1>
          <p className="muted">{mes.replace("_"," ")}</p>
        </div>

        <div className="stat-grid">
          <div className="stat-card"><div className="stat-label">Encuestadores</div><div className="stat-value">{data.length}</div></div>
          <div className="stat-card"><div className="stat-label">Monto total</div><div className="stat-value" style={{fontSize:18}}>${totalMonto.toLocaleString("es-CL")}</div></div>
          <div className="stat-card"><div className="stat-label">Boletas recibidas</div><div className="stat-value">{boletasOk} / {data.length}</div></div>
          <div className="stat-card"><div className="stat-label">Sin contrato</div><div className="stat-value" style={{color: sinContrato>0?"var(--red)":"var(--green)"}}>{sinContrato}</div></div>
        </div>

        {sinContrato > 0 && (
          <div className="alert alert-warning" style={{marginBottom:"1rem"}}>
            <i className="ti ti-alert-triangle" aria-hidden="true"></i>
            <span><strong>{sinContrato} encuestador{sinContrato>1?"es":""}</strong> sin contrato firmado. Deben contactar al jefe de campo.</span>
          </div>
        )}

        <div className="tab-bar">
          {[["resumen","Resumen","ti-layout-dashboard"],["encuestadores","Encuestadores","ti-users"],["cargar","Cargar planilla","ti-upload"],["onedrive","OneDrive","ti-brand-onedrive"]].map(([id,label,icon]) => (
            <button key={id} className={`tab${tab===id?" active":""}`} onClick={() => setTab(id)}>
              <i className={`ti ${icon}`} aria-hidden="true" style={{marginRight:4}}></i>{label}
            </button>
          ))}
        </div>

        {tab === "resumen" && (
          <div className="card">
            <p className="section-title">Estado de boletas</p>
            <div className="table-wrap">
              <table>
                <thead><tr><th>Nombre</th><th>RUT</th><th>Proyecto</th><th>Monto</th><th>Contrato</th><th>Boleta</th></tr></thead>
                <tbody>
                  {data.map((r,i) => (
                    <tr key={i}>
                      <td style={{fontWeight:500}}>{r.nombre}</td>
                      <td><code>{r.rut}</code></td>
                      <td>{r.proyecto}</td>
                      <td>${r.monto.toLocaleString("es-CL")}</td>
                      <td>{r.contrato ? <span className="badge badge-success"><i className="ti ti-check" aria-hidden="true"></i> Al día</span> : <span className="badge badge-danger"><i className="ti ti-x" aria-hidden="true"></i> Pendiente</span>}</td>
                      <td>{r.boleta ? <span className="badge badge-success">{r.numBoleta}</span> : <span className="badge badge-warning">Sin subir</span>}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        )}

        {tab === "encuestadores" && (
          <div className="card">
            <p className="section-title">Detalle de encuestadores</p>
            <div className="table-wrap">
              <table>
                <thead><tr><th>Nombre</th><th>RUT</th><th>Proyecto</th><th>Encuestas</th><th>Monto</th><th>Empresa receptora</th></tr></thead>
                <tbody>
                  {data.map((r,i) => (
                    <tr key={i}>
                      <td style={{fontWeight:500}}>{r.nombre}</td>
                      <td><code>{r.rut}</code></td>
                      <td>{r.proyecto}</td>
                      <td style={{textAlign:"center"}}>{r.encuestas}</td>
                      <td>${r.monto.toLocaleString("es-CL")}</td>
                      <td>{r.empresa}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        )}

        {tab === "cargar" && (
          <div className="card">
            <p className="section-title">Cargar planilla Excel</p>
            <p className="muted" style={{marginBottom:"1rem"}}>
              Columnas requeridas: <code>RUT</code> · <code>Nombre</code> · <code>Proyecto</code> · <code>Monto</code> · <code>Encuestas</code> · <code>Empresa</code> · <code>RUT Empresa</code> · <code>Dirección Empresa</code> · <code>Contrato Firmado</code> (SI/NO)
            </p>
            <div className="upload-zone" onClick={() => fileRef.current.click()}>
              <i className="ti ti-file-spreadsheet" style={{fontSize:40,color:"var(--blue)",display:"block",marginBottom:8}} aria-hidden="true"></i>
              <p style={{fontWeight:500,marginBottom:4}}>Haz clic para subir el Excel</p>
              <p className="muted">Formatos admitidos: .xlsx · .xls</p>
              <input ref={fileRef} type="file" accept=".xlsx,.xls" style={{display:"none"}} onChange={handleExcel} />
            </div>
            {excelMsg && (
              <div className={`alert ${excelMsg.startsWith("✓")?"alert-success":"alert-warning"}`} style={{marginTop:"1rem"}}>
                <i className={`ti ${excelMsg.startsWith("✓")?"ti-check":"ti-alert-triangle"}`} aria-hidden="true"></i>
                {excelMsg}
              </div>
            )}
          </div>
        )}

        {tab === "onedrive" && (
          <div className="card">
            <p className="section-title">Configuración OneDrive</p>
            {!token ? (
              <>
                <div className="alert alert-info" style={{marginBottom:"1rem"}}>
                  <i className="ti ti-info-circle" aria-hidden="true"></i>
                  <span>Conecta tu cuenta Microsoft para guardar las boletas automáticamente. Se creará la carpeta <code>Boletas_Honorarios/{mes}</code> en tu OneDrive.</span>
                </div>
                <button className="btn btn-primary" onClick={conectar} disabled={connecting}>
                  {connecting ? <><span className="spinner"></span> Conectando...</> : <><i className="ti ti-brand-onedrive" aria-hidden="true"></i> Conectar con OneDrive</>}
                </button>
              </>
            ) : (
              <>
                <div className="alert alert-success" style={{marginBottom:"1rem"}}>
                  <i className="ti ti-circle-check" aria-hidden="true"></i>
                  <div>
                    <strong>OneDrive conectado</strong>
                    <p style={{fontSize:13,marginTop:3}}>Carpeta activa: <code>OneDrive / {FOLDER_ROOT} / {mes}</code></p>
                  </div>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                  <div className="stat-card"><div className="stat-label">Carpeta del mes</div><div style={{fontSize:13,fontWeight:500,marginTop:4}}>{mes}</div></div>
                  <div className="stat-card"><div className="stat-label">Boletas guardadas</div><div className="stat-value">{boletasOk}</div></div>
                </div>
              </>
            )}
          </div>
        )}
      </div>
    </>
  );
}

// ─── ENCUESTADOR LOGIN ────────────────────────────────────────────────────────
function EncLogin({ data, onOk, onBack }) {
  const [rut, setRut] = useState("");
  const [err, setErr] = useState("");
  const buscar = () => {
    const clean = rut.trim().toLowerCase().replace(/\s/g,"");
    const enc = data.find(r => r.rut.toLowerCase().replace(/\s/g,"") === clean);
    if (enc) onOk(enc);
    else setErr("RUT no encontrado. Verifica el formato (ej: 12345678-9)");
  };
  return (
    <>
      <header className="site-header">
        <div className="logo"><div className="logo-icon"><i className="ti ti-report-money" style={{fontSize:18,color:"white"}} aria-hidden="true"></i></div>Portal Honorarios</div>
        <button className="btn btn-ghost btn-sm" onClick={onBack}><i className="ti ti-arrow-left" aria-hidden="true"></i> Volver</button>
      </header>
      <div className="page-narrow" style={{marginTop:40}}>
        <div className="card">
          <div style={{textAlign:"center",marginBottom:"1.5rem"}}>
            <div style={{width:48,height:48,borderRadius:"50%",background:"var(--blue-light)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 12px"}}>
              <i className="ti ti-user" style={{fontSize:22,color:"var(--blue)"}} aria-hidden="true"></i>
            </div>
            <h2 style={{fontSize:18,fontWeight:600}}>Portal Encuestador</h2>
            <p className="muted" style={{marginTop:4}}>Ingresa tu RUT para ver tu información de pago</p>
          </div>
          <div className="form-group">
            <label className="form-label">RUT</label>
            <input className="form-input" value={rut} placeholder="12345678-9"
              onChange={e => { setRut(e.target.value); setErr(""); }}
              onKeyDown={e => e.key==="Enter" && buscar()} />
            {err && <span className="form-error">{err}</span>}
          </div>
          <button className="btn btn-primary" style={{width:"100%"}} onClick={buscar}>
            <i className="ti ti-login" aria-hidden="true"></i> Ver mi información
          </button>
        </div>
      </div>
    </>
  );
}

// ─── ENCUESTADOR VIEW ─────────────────────────────────────────────────────────
function EncView({ enc, data, setData, token, setToken, onBack }) {
  const [numBoleta,  setNum]   = useState(enc.numBoleta || "");
  const [file,       setFile]  = useState(null);
  const [uploading,  setUpl]   = useState(false);
  const [authLoad,   setAuth]  = useState(false);
  const [done,       setDone]  = useState(enc.boleta || false);
  const [msg,        setMsg]   = useState({ text:"", type:"" });
  const fileRef = useRef();

  const handleFile = e => {
    const f = e.target.files[0];
    if (f && f.type === "application/pdf") { setFile(f); setMsg({text:"",type:""}); }
    else setMsg({ text:"Solo se admiten archivos PDF.", type:"warning" });
  };

  const handleSubir = async () => {
    if (!numBoleta.trim()) { setMsg({ text:"Ingresa el número de boleta.", type:"warning" }); return; }
    if (!file)             { setMsg({ text:"Selecciona un archivo PDF.", type:"warning" }); return; }

    let tok = token;
    if (!tok) {
      setAuth(true);
      setMsg({ text:"Iniciando sesión con Microsoft...", type:"info" });
      try { tok = await getToken(); setToken(tok); }
      catch(e) { setMsg({ text:"No se pudo autenticar: " + e.message, type:"danger" }); setAuth(false); return; }
      setAuth(false);
    }

    setUpl(true);
    setMsg({ text:"Subiendo boleta a OneDrive...", type:"info" });
    try {
      const mes      = getMesCarpeta();
      const nombre   = enc.nombre.replace(/\s+/g,"_");
      const fileName = `${enc.rut}_${numBoleta.trim()}_${nombre}.pdf`;
      await uploadPDF(tok, file, fileName, mes);
      setDone(true);
      setMsg({ text:`Boleta guardada en OneDrive/${FOLDER_ROOT}/${mes}`, type:"success" });
      setData(data.map(r => r.rut === enc.rut ? { ...r, boleta:true, numBoleta:numBoleta.trim() } : r));
    } catch(e) {
      setMsg({ text:"Error al subir: " + e.message, type:"danger" });
    }
    setUpl(false);
  };

  const initials = enc.nombre.split(" ").map(n=>n[0]).slice(0,2).join("");

  return (
    <>
      <header className="site-header">
        <div className="logo"><div className="logo-icon"><i className="ti ti-report-money" style={{fontSize:18,color:"white"}} aria-hidden="true"></i></div>Portal Honorarios</div>
        <button className="btn btn-ghost btn-sm" onClick={onBack}><i className="ti ti-arrow-left" aria-hidden="true"></i> Volver</button>
      </header>

      <div className="page" style={{maxWidth:640}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:"1.5rem"}}>
          <div className="avatar">{initials}</div>
          <div>
            <h1 style={{fontSize:20,fontWeight:600}}>{enc.nombre}</h1>
            <p className="muted"><code>{enc.rut}</code> · {enc.proyecto}</p>
          </div>
        </div>

        {!enc.contrato && (
          <div className="alert alert-warning" style={{marginBottom:"1rem"}}>
            <i className="ti ti-alert-triangle" aria-hidden="true"></i>
            <div>
              <strong>Contrato de honorarios pendiente</strong>
              <p style={{marginTop:4,fontSize:13}}>Aún no tienes firmado tu contrato de honorarios. Por favor, contáctate con el <strong>jefe de campo</strong> para regularizar tu situación antes de emitir la boleta.</p>
            </div>
          </div>
        )}
        {enc.contrato && (
          <div className="alert alert-success" style={{marginBottom:"1rem"}}>
            <i className="ti ti-circle-check" aria-hidden="true"></i>
            <span>Al día con la firma del contrato de honorarios.</span>
          </div>
        )}

        <div className="card" style={{marginBottom:"1rem"}}>
          <p className="section-title">Detalle de pago</p>
          <div className="stat-grid" style={{marginBottom:"1rem"}}>
            <div className="stat-card"><div className="stat-label">Monto a cobrar</div><div className="stat-value">${enc.monto.toLocaleString("es-CL")}</div></div>
            <div className="stat-card"><div className="stat-label">Cantidad de encuestas</div><div className="stat-value">{enc.encuestas}</div></div>
          </div>
          <div className="stat-card" style={{background:"var(--blue-light)"}}>
            <div className="stat-label" style={{color:"var(--blue)"}}>Proyecto</div>
            <div style={{fontWeight:500,marginTop:4,color:"var(--blue)"}}>{enc.proyecto}</div>
          </div>
        </div>

        <div className="card" style={{marginBottom:"1rem"}}>
          <p className="section-title">
            <i className="ti ti-building" style={{marginRight:6,color:"var(--blue)"}} aria-hidden="true"></i>
            Datos tributarios para emitir boleta
          </p>
          <p className="muted" style={{marginBottom:"0.75rem"}}>Emite tu boleta de honorarios a nombre de:</p>
          <div style={{background:"#faf9f6",border:"1px solid var(--gray-border)",borderRadius:"var(--radius)",padding:"14px 16px"}}>
            <p style={{fontWeight:600,fontSize:15,marginBottom:6}}>{enc.empresa}</p>
            <p className="muted"><strong>RUT:</strong> {enc.empresaRUT}</p>
            <p className="muted"><strong>Dirección:</strong> {enc.empresaDir}</p>
          </div>
        </div>

        <div className="card">
          <p className="section-title">
            <i className="ti ti-cloud-upload" style={{marginRight:6,color:"var(--blue)"}} aria-hidden="true"></i>
            Subir boleta de honorarios
          </p>

          {!token && (
            <div className="alert alert-info" style={{marginBottom:"1rem"}}>
              <i className="ti ti-info-circle" aria-hidden="true"></i>
              <span>Al subir tu boleta se abrirá una ventana para iniciar sesión con tu cuenta Microsoft.</span>
            </div>
          )}

          {!done ? (
            <>
              <div className="form-group">
                <label className="form-label">Número de boleta</label>
                <input className="form-input" value={numBoleta} placeholder="Ej: BOL-2026-001"
                  onChange={e => setNum(e.target.value)} />
              </div>
              <div className="upload-zone" style={{marginBottom:"1rem"}} onClick={() => fileRef.current.click()}>
                <i className="ti ti-file-type-pdf" style={{fontSize:36,color:"var(--red)",display:"block",marginBottom:6}} aria-hidden="true"></i>
                {file
                  ? <><p style={{fontWeight:500}}>{file.name}</p><p className="muted">{(file.size/1024).toFixed(1)} KB · PDF</p></>
                  : <><p style={{fontWeight:500}}>Seleccionar PDF</p><p className="muted">Solo se admiten archivos PDF</p></>
                }
                <input ref={fileRef} type="file" accept="application/pdf" style={{display:"none"}} onChange={handleFile} />
              </div>
              <button className="btn btn-primary" style={{width:"100%"}} onClick={handleSubir} disabled={uploading||authLoad}>
                {uploading||authLoad
                  ? <><span className="spinner"></span>{authLoad?"Autenticando...":"Subiendo a OneDrive..."}</>
                  : <><i className="ti ti-cloud-upload" aria-hidden="true"></i> Subir boleta a OneDrive</>}
              </button>
            </>
          ) : (
            <div className="alert alert-success">
              <i className="ti ti-circle-check" aria-hidden="true"></i>
              <div>
                <strong>Boleta enviada correctamente</strong>
                <p style={{fontSize:13,marginTop:3}}>N° {numBoleta} · Guardada en <code>OneDrive/{FOLDER_ROOT}/{getMesCarpeta()}</code></p>
              </div>
            </div>
          )}

          {msg.text && !done && (
            <div className={`alert alert-${msg.type}`} style={{marginTop:"0.75rem"}}>
              <i className={`ti ${msg.type==="success"?"ti-check":msg.type==="danger"?"ti-x":"ti-info-circle"}`} aria-hidden="true"></i>
              {msg.text}
            </div>
          )}
        </div>
      </div>
    </>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
